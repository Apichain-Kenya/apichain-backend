# DigitalOcean App Platform spec — apichain-backend (STAGING).
#
# STATUS: TEMPLATE, NOT DEPLOYED. Authored in Phase 0 (WP5) so the deploy shape
# exists and activation is a checklist, not a design exercise. It is UNTESTED
# and intentionally inert: no DO account, token, or managed database exists yet
# (deferred on cost grounds — local `docker compose up` is the dev/test target).
# The env and database blocks below are completed in Phase 1, when the schema
# baseline and real runtime settings land. Do not treat this as working infra.
#
# Activation (add funds + DO account): see DEPLOYMENT.md in this repo.

# ONE APP, ONE ORIGIN (12 D4, Phase 4a). The PWA and the API are served from a
# single App Platform app: the static site at `/`, the API service at `/v2` and
# `/health`. This is a requirement, not a convenience: the refresh token is a
# SameSite=Strict cookie scoped to /v2/auth, and `ondigitalocean.app` is on the
# Public Suffix List, so two separate apps would be different *sites* and the
# browser would never send the cookie. Do not split this back into two apps.
# The client repo's old standalone static-site spec is retired in favour of
# this one.

name: apichain-staging
region: fra # Frankfurt — closest DO region to Kenya

ingress:
  rules:
    # preserve_path_prefix: App Platform trims the matched prefix by default,
    # and every API route is mounted under /v2. Without this, /v2/auth/login
    # would reach the API as /auth/login and 404 (pre-merge review).
    - component: { name: api, preserve_path_prefix: true }
      match: { path: { prefix: /v2 } }
    - component: { name: api, preserve_path_prefix: true }
      match: { path: { prefix: /health } }
    - component: { name: web }
      match: { path: { prefix: / } }

static_sites:
  - name: web
    github:
      repo: Apichain-Kenya/apichain-client
      branch: main
      deploy_on_push: false
    source_dir: /
    build_command: npm ci && npm run build
    output_dir: dist
    # Every app URL serves the shell; the PWA router takes it from there.
    catchall_document: index.html

services:
  - name: api
    dockerfile_path: Dockerfile # CI already builds this image on every push
    source_dir: /
    github:
      repo: Apichain-Kenya/apichain-backend
      branch: main
      deploy_on_push: false # CD is driven by the gated .github/workflows/deploy.yml
    http_port: 8000
    instance_size_slug: basic-xxs # ~$5/mo
    instance_count: 1
    health_check:
      http_path: /health # app/main.py:25
    envs:
      # DATABASE_URL binds to the managed DB below once it is provisioned.
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      # Phase 1+ runtime secrets (SECRET_KEY, object storage, mail) are added
      # here as DO-managed secrets at activation, NOT committed to git.

