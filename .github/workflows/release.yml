# Publish the OpenAPI schema as a versioned artifact on every tagged release
# (05 §6.2 guardrail 1). The client pins a specific tag's schema.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  attach-openapi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Attach openapi.json to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: openapi.json
