# Publish the OpenAPI schema as a versioned artifact on every tagged release
# (05 §6.2 guardrail 1). The client pins a specific tag's schema.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  attach-openapi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Attach openapi.json to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: openapi.json
