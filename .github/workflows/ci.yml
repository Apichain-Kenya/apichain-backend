name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: apichain
          POSTGRES_PASSWORD: apichain
          POSTGRES_DB: apichain_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apichain"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://apichain:apichain@localhost:5432/apichain_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Sync dependencies (frozen)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy

      # The floor is `fail_under` in pyproject.toml (14 P5-E): it only goes up.
      - name: Tests (unit + integration + contract, real Postgres/PostGIS) + coverage floor
        run: uv run pytest -q --cov --cov-report=term

      - name: OpenAPI schema is up to date (contract guardrail)
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code openapi.json

      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --no-dev --format requirements-txt > requirements-audit.txt
          uv tool run pip-audit -r requirements-audit.txt --disable-pip

  # Shared, reusable cross-repo gates (05 §6.2 guardrail 4): the secret scan
  # and the image build + Trivy scan run byte-identical logic in both repos.
  shared:
    uses: ./.github/workflows/quality-gates.yml
    with:
      scan-image: true
      build-args: GIT_SHA=${{ github.sha }}
