# Schemathesis contract-test configuration (05 §6.2 guardrail 3).
#
# One suppressed Hypothesis health check, `filter_too_much`. It measures how
# efficiently test data is *generated*, not whether the API is correct, and it
# fires before any request is judged. Negative-mode generation must produce
# values that violate the schema yet can still be sent over HTTP. For a
# free-form header like `Idempotency-Key`, every string is valid, so nothing
# can violate it; draws that are not Latin-1 or that contain control
# characters cannot be sent at all; and `null` cannot travel in a header. So
# Schemathesis discards most draws. POST /v2/batches has only a body and that
# header to mutate, so it tripped the check on ~20% of runs: the "unexplained
# Phase 2 intermittent", captured on PR #12 (2026-10-07). Every example that
# does get generated is still sent and still checked in full.
suppress-health-check = ["filter_too_much"]
# NOTE: under pytest in CI this line is overridden by Hypothesis's `ci`
# profile, so tests/test_contract.py restates the suppression with an
# explicit @settings. Keep the two in step. This line still governs local
# runs and the schemathesis CLI.
#
# Only one narrow exemption, and it is a schema-expressiveness limit rather
# than an app defect: bcrypt refuses a password longer than 72 **bytes**, so
# both password-taking operations validate the UTF-8 byte length and return a
# documented 422. JSON Schema can only bound a string in **characters**, so a
# 72-character password of combining marks is schema-compliant yet >72 bytes,
# and `positive_data_acceptance` reports the resulting 422 as "valid data was
# rejected". The constraint cannot be expressed in the schema, so it is
# declared here instead. The check stays fully active everywhere else, and
# every other check stays active on these two operations.

[[operations]]
include-name = "POST /v2/auth/login"

[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", "401", "403", "404", "409", "422", "5xx"]

[[operations]]
include-name = "POST /v2/farmers"

[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", "401", "403", "404", "409", "422", "5xx"]
