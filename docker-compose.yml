# ApiChain v2 dev stack. `docker compose up` replaces the v1 Windows
# venv-activate + taskkill-uvicorn-zombies routine entirely.
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://apichain:apichain@db:5432/apichain_v2
      # Phase 3b boundaries, pointed at the services below. Presigned URLs
      # are signed for the browser-reachable host, not the in-cluster one.
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: localhost:9000
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      CLAMD_HOST: clamav
    volumes:
      - ./app:/srv/app # dev reload mount
    command:
      [
        "uv", "run", "--no-sync", "uvicorn", "app.main:app",
        "--host", "0.0.0.0", "--port", "8000", "--reload",
      ]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: apichain
      POSTGRES_PASSWORD: apichain
      POSTGRES_DB: apichain_v2
    # Host 5433 matches the v1 convention; the DB name is apichain_v2 (not
    # apichain) so it never aliases the v1 database. Stop any native :5433
    # Postgres before `docker compose up`, or this container can't bind the port.
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apichain"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: apichain
      MINIO_ROOT_PASSWORD: apichain-dev
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data

  mail:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"] # UI :8025, SMTP :1025

  # Antivirus for document uploads (P3b, 11 D5). Behind a profile because the
  # signature database is a few hundred MB and the first start takes minutes:
  #   docker compose --profile av up
  # Without it, uploads answer 503 (the scanner fails closed). On a machine
  # with no Docker, set SCANNER_BACKEND=fake in .env on purpose; rows scanned
  # that way are stamped scan_engine='fake' forever. CI never needs it.
  clamav:
    image: clamav/clamav:1.4
    profiles: ["av"]
    ports: ["3310:3310"]

volumes:
  pgdata:
  miniodata:
